<button data-t="tx" onclick="go('tx')"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Activity</span></button>
<button class="plus" onclick="openForm()" aria-label="Add transaction"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add transaction</span></button>
<button data-t="trend" onclick="go('trend')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg><span>Trends</span></button>
<button data-t="set" onclick="go('set')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg><span>Settings</span></button>
</nav>
<div id="modal"></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const S={tab:'home',mon:ym(new Date()),f:'month',months:{},set:{},init:false,a:0,b:0};
let db=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>a.reduce((x,t)=>x+t.a,0);
const sym=()=>S.set.sym??'Rp';
const fmt=n=>{const r=sym()=='Rp',d=r?0:2;return(n<0?'-':'')+sym()+' '+Math.abs(n).toLocaleString(r?'id-ID':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const mOf=d=>d.slice(0,7);const ymd=d=>ym(d)+'-'+String(d.getDate()).padStart(2,'0');
const mlabel=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleString('en',{month:'long',year:'numeric'});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

function shift(n){const[y,m]=S.mon.split('-').map(Number);S.mon=ym(new Date(y,m-1+n,1));draw()}
const mnav=()=>`<div class="mn"><button onclick="shift(-1)">‹</button><span>${mlabel(S.mon)}</span><button onclick="shift(1)">›</button></div>`;
function go(t){S.tab=t;$('nav').classList.remove('hide');draw();const a=$('app');void a.offsetWidth;a.classList.add('in');scrollTo(0,0)}

/* ---------- on-device storage (used when this file is opened outside Claude) ---------- */
const FB={on:false,user:null,mig:0,srv:0};
const LS={
 get(k){try{return JSON.parse(localStorage.getItem('twopots:'+k))}catch(e){return null}},
 set(k,v){try{localStorage.setItem('twopots:'+k,JSON.stringify(v))}catch(e){toast('Could not save on this device')}}
};

/* ---------- data ---------- */
function calc(){
 const all=Object.values(S.months).flatMap(m=>m.tx||[]);
 let biz=S.set.ob||0,per=S.set.op||0;
 for(const t of all){
  if(t.k=='t'){if(t.dir=='bp'){biz-=t.a;per+=t.a}else{per-=t.a;biz+=t.a}}
  else if(t.b=='per')per+=t.a;else biz+=t.a;
 }
 return{biz,per,total:biz+per,all};
}
const findT=id=>{for(const m in S.months){const t=(S.months[m].tx||[]).find(x=>x.id==id);if(t)return t}};
async function commit(ch){
 for(const m in ch)S.months[m]={tx:ch[m]};
 draw();
 if(!db){LS.set('months',S.months);return}
 try{for(const m in ch)await db.doc('months/'+m).set({tx:ch[m]})}catch(e){toast('Could not save: '+(e.message||e.code))}
}
function saveTx(t){
 const ch={},old=findT(t.id);
 if(old){const om=mOf(old.d);ch[om]=S.months[om].tx.filter(x=>x.id!=t.id)}
 const nm=mOf(t.d),base=ch[nm]||[...(S.months[nm]?.tx||[])];
 ch[nm]=[...base.filter(x=>x.id!=t.id),t];
 return commit(ch);
}
function delTx(id){const t=findT(id);if(!t)return;const m=mOf(t.d);closeM();return commit({[m]:S.months[m].tx.filter(x=>x.id!=id)})}
function setS(k,v){
 S.set={...S.set,[k]:v};draw();
 if(db)db.doc('meta/settings').set(S.set).catch(e=>toast('Could not save: '+(e.message||e.code)));
 else LS.set('settings',S.set);
}

const pnum=v=>{v=String(v??'').trim();if(v==='')return null;const r=sym()=='Rp';v=v.split(r?'.':',').join('');if(r)v=v.replace(',','.');return v===''||isNaN(+v)?null:+v};
const grp=t=>t.replace(/\B(?=(\d{3})+(?!\d))/g,sym()=='Rp'?'.':',');
const fin=n=>{if(n==null||n==='')return'';const r=sym()=='Rp',[i,d]=String(Math.round(Math.abs(n)*100)/100).split('.');return(n<0?'-':'')+grp(i)+(d?(r?',':'.')+d:'')};
function mask(el,neg){
 const r=sym()=='Rp',ts=r?'.':',',ds=r?',':'.',v=el.value,pos=el.selectionStart??v.length,
  sg=ch=>/[0-9]/.test(ch)||ch==ds||(neg&&ch=='-'),ng=neg&&v.trim().startsWith('-');
 const raw=v.split(ts).join('').replace(r?/[^0-9,]/g:/[^0-9.]/g,''),k=raw.indexOf(ds);
 let ip=k<0?raw:raw.slice(0,k);const dp=k<0?null:raw.slice(k+1).replace(/\D/g,'').slice(0,2);
 ip=ip.replace(/^0+(?=\d)/,'');if(!ip&&dp!=null)ip='0';
 const out=(ng?'-':'')+grp(ip)+(dp==null?'':ds+dp);

 const tg=`<div class="seg" style="margin-bottom:14px"><button class="${dy?'':'on'}" onclick="S.gr='m';draw()">Monthly</button><button class="${dy?'on':''}" onclick="S.gr='d';draw()">Daily</button></div>`,

 const sec=(t,s,l,svg)=>`<section class="sec"><h3>${t}</h3><p class="mut" style="margin:-6px 0 10px">${s}</p>${l}${svg}</section>`;
 return`<h2>Trends</h2>${tg}<div class="chips">${chips}</div><p class="mut" style="margin:0 0 12px">${lb(keys[0])} to ${lb(L.k)}</p>`
 +sec('Income and expenses','Business money in and out each '+u,lg([['var(--bizf)','Income'],['var(--mut)','Expenses']]),chart('bar',keys,[{n:'Income',v:v(x=>x.inc),c:'var(--bizf)'},{n:'Expenses',v:v(x=>x.exp),c:'var(--mut)'}]))
 +sec('Profit',dv(L.profit,P.profit),'',chart('bar',keys,[{n:'Profit',v:v(x=>x.profit),c:'var(--pos)',neg:1}]))
 +sec('Expenses vs sales',L.pct==null?'No sales in the latest '+u:'Expenses were '+Math.round(L.pct)+'% of sales in the latest '+u,'',chart('line',keys,[{n:'Expenses',v:v(x=>x.pct),c:'var(--bizf)'}],1))

}

/* ---------- export ---------- */
async function exportCSV(){
 const all=[...calc().all].sort((a,b)=>a.d.localeCompare(b.d));
 if(!all.length){toast('Nothing to export yet');return}
 const sp=S.set.sep||',',r2=x=>Math.round(x*100)/100;
 const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return/[";,\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const rows=[['Date','Month','Description','Type','Bucket','Amount','Business effect','Personal effect']];
 for(const t of all){
  const tr=t.k=='t',p=t.b=='per',bp=t.dir=='bp';
  rows.push([t.d,t.d.slice(0,7),q(t.t),tr?(bp?'Owner draw':'Contribution'):t.a>=0?'Money in':'Money out',tr?'Transfer':p?'Personal':'Business',r2(t.a),tr?r2(bp?-t.a:t.a):p?0:r2(t.a),tr?r2(bp?t.a:-t.a):p?r2(t.a):0]);
 }
 const csv='\uFEFF'+rows.map(r=>r.join(sp)).join('\r\n'),fn='two-pots-'+today()+'.csv';
 let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn,data:csv});toast('Saved '+fn)}catch(e){if(e&&e.code!='declined')toast('Could not save the file')}return}
 if(window.claude){toast('Downloads are not available here');return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);
}

/* ---------- chart tooltips: hover (mouse) or tap/click ---------- */
{const tp=document.createElement('div');tp.id='tip';document.body.appendChild(tp);let cur=null,pin=false;
 const hide=()=>{tp.style.display='none';if(cur)cur.classList.remove('hot');cur=null;pin=false};
 const show=(el,x,y)=>{
  if(cur!==el){if(cur)cur.classList.remove('hot');cur=el;el.classList.add('hot');
   try{const[t,rows]=JSON.parse(el.dataset.tip);tp.innerHTML='<b>'+esc(t)+'</b>'+rows.map(([c,n,v])=>'<div><span><i style="background:'+c+'"></i>'+esc(n)+'</span><em>'+esc(v)+'</em></div>').join('')}catch(e){return}}
  tp.style.display='block';
  const w=tp.offsetWidth,h=tp.offsetHeight;
  tp.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+'px';
  tp.style.top=(y-h-14<8?y+18:y-h-14)+'px';
 };
 const hitOf=e=>e.target&&e.target.closest?e.target.closest('.hit'):null;
 document.addEventListener('pointermove',e=>{if(pin||e.pointerType=='touch')return;const el=hitOf(e);el?show(el,e.clientX,e.clientY):hide()});
 document.addEventListener('click',e=>{const el=hitOf(e);if(!el){hide();return}
  if(e.pointerType=='mouse'){show(el,e.clientX,e.clientY);return}
  if(pin&&cur===el)hide();else{pin=true;show(el,e.clientX,e.clientY)}});
 addEventListener('scroll',hide,{passive:true});
}

{let ly=scrollY,busy=false;
 addEventListener('scroll',()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{
  const y=scrollY,d=y-ly,nav=$('nav'),end=innerHeight+y>=document.documentElement.scrollHeight-48;

async function fbMigrate(){
 if(FB.mig||!(S.a&&S.b&&FB.srv))return;FB.mig=1;
 const lm=LS.get('months')||{},ls=LS.get('settings')||{};
 if(LS.get('moved')||Object.keys(S.months).length||Object.keys(S.set).length)return;
 if(!Object.keys(lm).length&&!Object.keys(ls).length)return;
 try{
  for(const m in lm)await db.doc('months/'+m).set({tx:lm[m].tx||[]});
  if(Object.keys(ls).length)await db.doc('meta/settings').set(ls);
  LS.set('moved',1);toast('Moved the data from this device to your account');
 }catch(e){toast('Could not move the data from this device')}
}
async function fbStart(){
 let A,F,U;
 try{
  const B='https://www.gstatic.com/firebasejs/11.10.0/';
  [A,F,U]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
 }catch(e){toast('Could not reach Firebase. Working on this device only.');return false}
 FB.on=true;S.init=true;
 const app=A.initializeApp(FB_CONFIG);
 let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(app)}
 const auth=U.getAuth(app);
 FB.signIn=async()=>{try{await U.signInWithPopup(auth,new U.GoogleAuthProvider())}catch(e){const c=(e&&e.code)||'';if(c=='auth/popup-closed-by-user'||c=='auth/cancelled-popup-request')return;toast(c=='auth/popup-blocked'?'Allow pop-ups for this site, then try again':c=='auth/unauthorized-domain'?'This web address is not authorised in Firebase yet':'Sign-in failed. Try again')}};
 FB.signOut=()=>U.signOut(auth);
 const wr=(p,v)=>{const q=F.setDoc(F.doc(fs,p),v);return Promise.race([q,new Promise(r=>setTimeout(r,1500))])};
 let off=[];
 U.onAuthStateChanged(auth,u=>{
  off.forEach(f=>f());off=[];FB.user=u;FB.mig=0;FB.srv=0;S.a=0;S.b=0;
  if(!u){db=null;S.months={};S.set={};fbLogin();return}
  $('nav').style.display='';
  db={doc:p=>({set:v=>wr(p,v)})};
  draw();
  off.push(F.onSnapshot(F.collection(fs,'months'),s=>{S.months={};s.docs.forEach(d=>{S.months[d.id]=d.data()});S.a=1;if(!s.metadata.fromCache)FB.srv=1;draw();fbMigrate()},fbErr));
  off.push(F.onSnapshot(F.doc(fs,'meta/settings'),s=>{S.set=s.exists()?{...s.data()}:{};S.b=1;draw();fbMigrate()},fbErr));
 });
 return true;
}

(async()=>{

 try{db=window.claude?await claude.use('db'):null}catch(e){db=null}
