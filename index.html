*{box-sizing:border-box}html,body{margin:0}
body{color:var(--fg);font:17px/1.47 'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;letter-spacing:-.011em;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(95% 52% at 50% -8%,#0b7580 0%,#053a41 42%,transparent 78%),radial-gradient(60% 40% at 100% 108%,rgba(255,170,40,.15),transparent 70%)}
main{max-width:640px;margin:0 auto;padding:20px 16px 150px}
h2{margin:8px 0 22px;font-size:36px;font-weight:700;letter-spacing:-.035em}
h3{margin:0 0 18px;font-size:22px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.logo{display:block;width:64px;height:58px;flex:none;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.035em;margin:2px 4px 16px}
.wm{display:flex;flex-direction:column;gap:5px;line-height:1}
.wm b{align-self:flex-start;font-size:30px;font-weight:800;letter-spacing:-.045em;padding-bottom:2px;filter:drop-shadow(0 0 16px rgba(43,182,125,.3))}
.wm em{font-style:normal;font-weight:300;letter-spacing:-.02em}
.wm i{font-style:normal;display:inline-block;background:linear-gradient(90deg,#6ff0b8 0%,#2bb67d 45%,#ffb62e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.wm small{font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--mut)}
.nb{display:none}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}.hd button{height:46px;font-size:15px;padding:0 22px}
.card,.sec{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border-radius:var(--r);padding:22px;margin-bottom:14px;box-shadow:0 18px 40px -14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08)}
.card::before,.sec::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.04) 45%,rgba(255,255,255,.1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.mut{color:var(--mut);font-size:15px}.pos{color:var(--pos)}.neg{color:var(--neg)}
.dt{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}.dt.b{background:var(--bizf);box-shadow:0 0 8px var(--bizf)}.dt.p{background:var(--perf);box-shadow:0 0 8px var(--perf)}.dt.x{box-shadow:inset 0 0 0 1.5px var(--mut)}
.hero{padding:24px}.big{font-size:clamp(38px,12vw,60px);font-weight:700;letter-spacing:-.045em;line-height:1.05;margin:6px 0 0;color:var(--mint);text-shadow:0 0 36px rgba(20,227,168,.4);overflow-wrap:anywhere}.big.neg{color:var(--neg);text-shadow:0 0 36px rgba(255,84,104,.35)}
.rr{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px}
.lg2{display:grid;gap:14px;font-size:16px;color:var(--mut)}.lg2 .dt{margin-right:10px}.lg2 b{color:var(--fg);font-weight:600;margin-left:8px}
.rw{position:relative;width:112px;height:112px;flex:none}.rw svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.rw circle{fill:none;stroke-width:11;stroke-linecap:round}
.r1{stroke:var(--perf);filter:drop-shadow(0 0 7px rgba(255,182,46,.6))}.r2{stroke:var(--bizf);filter:drop-shadow(0 0 8px rgba(43,182,125,.65))}
.rw b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:700}
.pots{padding:4px 22px 18px}
.pot{display:flex;align-items:center;gap:14px;padding:16px 0}.pot+.pot{border-top:1px solid var(--line)}
.ti{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}.ti.b{background:rgba(43,182,125,.16);color:var(--bizf)}.ti.p{background:rgba(255,182,46,.18);color:var(--perf)}
.pc{flex:1;min-width:0}.pn{font-weight:500;font-size:15px;color:var(--mut);line-height:1.3}
.pot .inp{display:flex;align-items:baseline;gap:6px;margin-top:2px}.inp span{font-size:18px;font-weight:600;color:var(--mut)}
.hint{margin:0;padding-top:14px;border-top:1px solid var(--line)}
.mn{display:flex;align-items:center;gap:6px;width:max-content;margin:8px auto 20px;padding:5px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-weight:600}.mn span{min-width:150px;text-align:center;font-size:17px}
.mn button{width:46px;height:46px;padding:0;border:0;background:none;color:var(--mint);font-size:26px;line-height:1}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.st.s2{grid-template-columns:1fr 1fr}.st span{display:block;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}.st b{font-size:30px;font-weight:700;letter-spacing:-.03em;overflow-wrap:anywhere}
.note{margin:20px 0 4px;padding-top:16px;border-top:1px solid var(--line);font-size:15px;color:var(--mut)}
.bar{display:grid;grid-template-columns:124px 1fr auto;align-items:center;gap:14px;margin:16px 0;font-size:15px}.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}.bar u{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.08)}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--bizf),#5fe3ab);box-shadow:0 0 12px rgba(43,182,125,.5)}
button,select,input{font:inherit;letter-spacing:inherit;color:var(--fg)}
button{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);border-radius:980px;height:54px;padding:0 26px;font-size:17px;font-weight:600;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .15s,opacity .2s}
button:active{transform:scale(.97)}
button.p{background:var(--blue);border-color:rgba(255,255,255,.25);color:#fff;box-shadow:0 8px 24px -4px rgba(31,123,255,.55),inset 0 1px 0 rgba(255,255,255,.35)}

.tr .dt.b{background:rgba(43,182,125,.15);color:var(--bizf)}.tr .dt.p{background:rgba(255,182,46,.17);color:var(--perf)}.tr .dt.x{background:rgba(255,255,255,.08);color:var(--mut)}.tr .dt.x::after{box-shadow:none}

.sheet{background:linear-gradient(180deg,rgba(44,54,58,.82),rgba(16,22,25,.9));-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.14);border-bottom:0;width:100%;max-width:520px;border-radius:32px 32px 0 0;padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px));max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 -12px 48px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12);animation:up .35s cubic-bezier(.2,.8,.2,1)}

.lbl{display:none}
@media(max-width:899px){#nav.hide{transform:translateY(calc(100% + 28px));opacity:0;pointer-events:none}}
.pot{cursor:pointer}.pot .v{font-size:28px;font-weight:700;letter-spacing:-.025em}.pot .v.neg{color:var(--neg)}
.pe{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mut);background:rgba(255,255,255,.07);transition:color .2s,background .2s}.pe .ic{width:19px;height:19px}
.pot:active .pe{color:var(--mint);background:rgba(20,227,168,.16)}
@media(hover:hover){.pot:hover .pe{color:var(--mint);background:rgba(20,227,168,.16)}}
.sheet label{display:flex;align-items:center;gap:8px}
.bsum{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}.bsum b{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--mint)}
.sec>h3+p{margin:-8px 0 14px!important}
.sheet label{margin:14px 0 6px}.sheet input,.sheet select{height:52px}.sheet .amt{height:auto}.sheet .seg button{height:42px}.sheet .g2 input,.sheet .g2 select{font-size:16px;padding:0 12px}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.ax{font-size:13px;fill:var(--mut)}.sec svg{display:block;max-width:100%}
.lg{display:flex;gap:16px;font-size:14px;color:var(--mut);margin-bottom:8px}.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@keyframes up{from{transform:translateY(36px);opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
#app.in>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}#app.in>:nth-child(2){animation-delay:.05s}#app.in>:nth-child(3){animation-delay:.1s}#app.in>:nth-child(4){animation-delay:.15s}#app.in>:nth-child(n+5){animation-delay:.2s}
@media(prefers-reduced-motion:reduce){*,::before{animation:none!important;transition:none!important}}
@media(hover:hover){button:hover{opacity:.85}#nav button:hover{opacity:1;color:var(--fg)}.tr:hover .d{color:var(--mint)}}
@media(max-width:479px){main{padding:14px 14px 150px}h2{font-size:32px}.card,.sec{padding:20px;margin-bottom:12px}.hero{padding:22px}.rr{margin-top:16px}.rw{width:96px;height:96px}.lg2{font-size:15px;gap:12px}.pots{padding:2px 20px 16px}.pot{padding:14px 0}.ti{width:50px;height:50px}.mn{margin:2px auto 16px}
.st,.st.s2{grid-template-columns:1fr;gap:0}.st>div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}.st>div:first-child{border-top:0;padding-top:0}.st>div:last-child{padding-bottom:0}.st span{margin:0;font-size:15px;font-weight:500;letter-spacing:0;text-transform:none}.st b{font-size:22px;font-weight:700}
.chips{gap:8px}.chips button{flex:1 0 auto;padding:0 12px;font-size:14px;height:44px}.tr .dt{width:46px;height:46px}.tr{padding:15px 0}#nav button{padding:10px 8px}.seg{flex-wrap:wrap}.seg button{flex:1 1 calc(50% - 2px)}.bar{grid-template-columns:96px 1fr auto}}
@media(min-width:600px){main{max-width:720px}.ov{align-items:center}.sheet{border-radius:32px;border-bottom:1px solid rgba(255,255,255,.14);padding-top:26px;animation:pop .3s cubic-bezier(.2,.8,.2,1)}.sheet::before{display:none}}
@media(min-width:900px){
body{padding-left:270px}
#nav{left:0;top:0;bottom:0;right:auto;width:270px;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-radius:0;border-width:0 1px 0 0;padding:30px 16px;background:rgba(8,14,16,.5)}
#app.home>.brand{display:none}.nb{display:flex;order:-3;margin:0;padding:0 8px 26px;font-size:22px}.nb .logo{width:60px;height:54px}.nb .wm b{font-size:26px}
#nav button{flex-direction:row;gap:14px;font-size:16px;padding:14px 16px;justify-content:flex-start;border-radius:16px}
#nav .plus{order:-1;width:auto;height:58px;margin-bottom:20px;border-radius:99px;padding:0 24px;font-size:17px;justify-content:center}

main{max-width:980px;padding:52px 40px 64px}
.big{font-size:76px}.hero{padding:34px}.pot .v{font-size:32px}
#app.home{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}
#app.home>.hero,#app.home>.pots,#app.home>.mn{grid-column:1/-1}
#app.tx,#app.set,#app.trend{max-width:720px;margin:0 auto}
#toast{left:calc(50% + 135px);bottom:32px}
}
</style></head>
<body>
<main id="app"></main>
<nav id="nav">
<div class="brand nb"><i class="logo"></i><span class="wm"><b><em>Two</em> <i>Pots</i></b><small>Business &amp; personal</small></span></div>
<button data-t="home" onclick="go('home')"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
<button data-t="tx" onclick="go('tx')"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Activity</span></button>
<button class="plus" onclick="openForm()" aria-label="Add transaction"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Add transaction</span></button>
<button data-t="trend" onclick="go('trend')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg><span>Trends</span></button>
<button data-t="set" onclick="go('set')"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg><span>Settings</span></button>
</nav>
<div id="modal"></div><div id="toast"></div>
<script>
const CATS={biz:{in:['Sales','Other income'],out:['Ingredients','Packaging','Delivery','Equipment','Rent & utilities','Marketing','Staff','Other expense']},per:{in:['Salary / income','Interest','Other income'],out:['Food & groceries','Bills','Transport','Health','Shopping','Other spending']}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const S={tab:'home',mon:ym(new Date()),f:'month',months:{},set:{},init:false,a:0,b:0};
let db=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=a=>a.reduce((x,t)=>x+t.a,0);
const sym=()=>S.set.sym??'Rp';
const fmt=n=>{const r=sym()=='Rp',d=r?0:2;return(n<0?'-':'')+sym()+' '+Math.abs(n).toLocaleString(r?'id-ID':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const mOf=d=>d.slice(0,7);
const mlabel=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1).toLocaleString('en',{month:'long',year:'numeric'});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function shift(n){const[y,m]=S.mon.split('-').map(Number);S.mon=ym(new Date(y,m-1+n,1));draw()}
const mnav=()=>`<div class="mn"><button onclick="shift(-1)">‹</button><span>${mlabel(S.mon)}</span><button onclick="shift(1)">›</button></div>`;
function go(t){S.tab=t;$('nav').classList.remove('hide');draw();const a=$('app');void a.offsetWidth;a.classList.add('in');scrollTo(0,0)}

/* ---------- on-device storage (used when this file is opened outside Claude) ---------- */
const LS={
 get(k){try{return JSON.parse(localStorage.getItem('twopots:'+k))}catch(e){return null}},
 set(k,v){try{localStorage.setItem('twopots:'+k,JSON.stringify(v))}catch(e){toast('Could not save on this device')}}
};

/* ---------- data ---------- */
function calc(){
 const all=Object.values(S.months).flatMap(m=>m.tx||[]);
 let biz=S.set.ob||0,per=S.set.op||0;
 for(const t of all){
  if(t.k=='t'){if(t.dir=='bp'){biz-=t.a;per+=t.a}else{per-=t.a;biz+=t.a}}
  else if(t.b=='per')per+=t.a;else biz+=t.a;
 }
 return{biz,per,total:biz+per,all};
}
const findT=id=>{for(const m in S.months){const t=(S.months[m].tx||[]).find(x=>x.id==id);if(t)return t}};
async function commit(ch){
 for(const m in ch)S.months[m]={tx:ch[m]};
 draw();
 if(!db){LS.set('months',S.months);return}
 try{for(const m in ch)await db.doc('months/'+m).set({tx:ch[m]})}catch(e){toast('Could not save: '+(e.message||e.code))}
}
function saveTx(t){
 const ch={},old=findT(t.id);
 if(old){const om=mOf(old.d);ch[om]=S.months[om].tx.filter(x=>x.id!=t.id)}
 const nm=mOf(t.d),base=ch[nm]||[...(S.months[nm]?.tx||[])];
 ch[nm]=[...base.filter(x=>x.id!=t.id),t];
 return commit(ch);
}
function delTx(id){const t=findT(id);if(!t)return;const m=mOf(t.d);closeM();return commit({[m]:S.months[m].tx.filter(x=>x.id!=id)})}
function setS(k,v){
 S.set={...S.set,[k]:v};draw();
 if(db)db.doc('meta/settings').set(S.set).catch(e=>toast('Could not save: '+(e.message||e.code)));
 else LS.set('settings',S.set);
}

const pnum=v=>{v=String(v).trim();if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v))v=v.replace(/\./g,'').replace(',','.');return v===''||isNaN(+v)?null:+v};
const r2=x=>Math.round(x*100)/100;
function openBal(key){
 const c=calc(),f=id=>`<input id="${id}" type="text" inputmode="decimal" autocomplete="off" oninput="balSum()" onkeydown="if(event.key=='Enter')saveBal()">`;
 $('modal').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sheet"><h3>Edit balances</h3>
 <p class="mut" style="text-align:center;margin:-6px 0 6px">Type what is really in each pot today.</p>
 <label><span class="dt b"></span>Business cash (${esc(sym())})</label>${f('eb')}
 <label><span class="dt p"></span>Personal savings (${esc(sym())})</label>${f('ep')}
 <div class="bsum"><span class="mut">Total in the bank</span><b id="et"></b></div>
 <div class="g2" style="margin-top:18px"><button class="p" onclick="saveBal()">Save</button><button onclick="closeM()">Cancel</button></div></div></div>`;
 $('eb').value=r2(c.biz);$('ep').value=r2(c.per);balSum();
 const e=$(key=='op'?'ep':'eb');e.focus();e.select();
}
function balSum(){const b=pnum($('eb').value),p=pnum($('ep').value);$('et').textContent=b==null||p==null?'–':fmt(b+p)}
function saveBal(){
 const b=pnum($('eb').value),p=pnum($('ep').value);
 if(b==null||p==null){toast('Enter an amount for both pots');return}
 const c=calc();closeM();
 setS('ob',r2((S.set.ob||0)+(b-c.biz)));setS('op',r2((S.set.op||0)+(p-c.per)));
 toast('Balances updated');
}

/* ---------- home ---------- */
function vHome(){
 const c=calc(),m=S.mon,ms=c.all.filter(t=>t.d.startsWith(m)),tx=ms.filter(t=>t.k!='t');
 const bz=tx.filter(t=>t.b!='per'),pr=tx.filter(t=>t.b=='per'),exo=bz.filter(t=>t.a<0);
 const inc=sum(bz.filter(t=>t.a>0)),exp=-sum(exo),ing=-sum(exo.filter(t=>t.c=='Ingredients'));
 const dr=ms.filter(t=>t.k=='t'&&t.dir=='bp').reduce((x,t)=>x+t.a,0),co=ms.filter(t=>t.k=='t'&&t.dir=='pb').reduce((x,t)=>x+t.a,0);
 const pin=sum(pr.filter(t=>t.a>0)),pout=-sum(pr.filter(t=>t.a<0)),sv=pin-pout+dr-co;
 const cats={};exo.forEach(t=>{const k=t.c||'Uncategorized';cats[k]=(cats[k]||0)-t.a});
 const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=cl.length?cl[0][1]:1;
 const cls=n=>n<0?'neg':'',pb=Math.max(0,c.biz),pp=Math.max(0,c.per),bw=pb+pp?Math.round(pb/(pb+pp)*100):50;
 const IC={b:'<rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 13.5h18"/>',p:'<path d="M4 11.5 12 4.5l8 7M6 10.5V19a1 1 0 0 0 1 1h3.2v-5h3.6v5H17a1 1 0 0 0 1-1v-8.5"/>'};
 const fnum=v=>{const r=sym()=='Rp',d=r?0:2;return(v<0?'-':'')+Math.abs(v).toLocaleString(r?'id-ID':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
 const PE='<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>';
 const pot=(k,l,v,key)=>`<div class="pot" role="button" tabindex="0" aria-label="Edit ${l}" onclick="openBal('${key}')" onkeydown="if(event.key=='Enter')openBal('${key}')"><i class="ti ${k}"><svg class="ic" viewBox="0 0 24 24">${IC[k]}</svg></i><div class="pc"><div class="pn">${l}</div><div class="inp"><span>${esc(sym())}</span><b class="v ${cls(v)}">${fnum(r2(v))}</b></div></div><i class="pe"><svg class="ic" viewBox="0 0 24 24">${PE}</svg></i></div>`;
 const C=2*Math.PI*40,ring=`<div class="rw"><svg viewBox="0 0 100 100"><circle class="r1" cx="50" cy="50" r="40"/><circle class="r2" cx="50" cy="50" r="40" stroke-dasharray="${(C*bw/100).toFixed(1)} ${C.toFixed(1)}" ${bw?'':'style="display:none"'}/></svg><b>${bw}%</b></div>`;
 let h=`<div class="brand"><i class="logo"></i><span class="wm"><b><em>Two</em> <i>Pots</i></b><small>Business &amp; personal</small></span></div><div class="hero card"><div class="mut">Total in the bank</div><div class="big ${c.total<0?'neg':''}">${fmt(c.total)}</div><div class="rr"><div class="lg2"><div><span class="dt b"></span>Business<b>${bw}%</b></div><div><span class="dt p"></span>Personal<b>${100-bw}%</b></div></div>${ring}</div></div>
 <div class="card pots">${pot('b','Business cash',c.biz,'ob')}${pot('p','Personal savings',c.per,'op')}<p class="mut hint">Tap a pot to edit its balance.</p></div>`;
 h+=mnav();
 h+=`<section class="sec"><h3><span class="dt b"></span>Business</h3><div class="st"><div><span>Income</span><b class="pos">${fmt(inc)}</b></div><div><span>Expenses</span><b>${fmt(exp)}</b></div><div><span>Profit</span><b class="${cls(inc-exp)}">${fmt(inc-exp)}</b></div></div>
 <p class="note">${inc>0?`Ingredients take ${Math.round(ing/inc*100)}% of sales. `:''}You took out ${fmt(dr)}${co?` and put in ${fmt(co)}`:''}.</p>
 ${cl.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><u><i style="width:${Math.max(3,v/mx*100)}%"></i></u><span>${fmt(v)}</span></div>`).join('')||'<p class="mut">No business expenses this month.</p>'}</section>`;
 h+=`<section class="sec"><h3><span class="dt p"></span>Personal</h3><div class="st s2"><div><span>Money in</span><b class="pos">${fmt(pin)}</b></div><div><span>Spending</span><b>${fmt(pout)}</b></div><div><span>From business</span><b>${fmt(dr-co)}</b></div><div><span>Saved this month</span><b class="${cls(sv)}">${fmt(sv)}</b></div></div></section>`;
 return h;
}

/* ---------- transactions ---------- */
function filt(){
 let l=calc().all.filter(t=>t.d.startsWith(S.mon));
 if(S.f=='biz')l=l.filter(t=>t.k!='t'&&t.b!='per');
 else if(S.f=='per')l=l.filter(t=>t.k!='t'&&t.b=='per');
 else if(S.f=='tr')l=l.filter(t=>t.k=='t');
 return l.sort((a,b)=>b.d.localeCompare(a.d));
}
function row(t){
 const tr=t.k=='t',dot=tr?'x':t.b=='per'?'p':'b';
 const sub=tr?(t.dir=='bp'?'To personal':'To business'):(t.c?esc(t.c):'No category');
 return`<div class="tr" onclick="openForm('${t.id}')"><span class="dt ${dot}"></span><div class="tm"><div class="d">${esc(t.t)}</div><div class="mut">${+t.d.slice(8)} ${MN[+t.d.slice(5,7)-1]} · ${sub}</div></div><b class="${!tr&&t.a>0?'pos':''}">${tr?'':t.a>0?'+':''}${fmt(t.a)}</b></div>`;
}
function vTx(){
 const ch=[['month','All'],['biz','Business'],['per','Personal'],['tr','Transfers']].map(([k,l])=>`<button class="${S.f==k?'on':''}" onclick="S.f='${k}';draw()">${l}</button>`).join('');
 const l=filt();
 return`<div class="hd"><h2>Transactions</h2><button onclick="exportCSV()">Export CSV</button></div>${mnav()}<div class="chips">${ch}</div><div class="card" style="margin-top:10px">${l.length?l.map(row).join(''):'<p class="mut">Nothing here yet.</p>'}</div>`;
}

/* ---------- add / edit ---------- */
function openForm(id){
 const t=id?findT(id):null,k=t?(t.k=='t'?t.dir:t.a>=0?'in':'out'):'out';
 const sg=(n,o)=>`<div class="seg" data-s="${n}">${o.map(([v,l])=>`<button type="button" data-v="${v}" onclick="seg('${n}','${v}')">${l}</button>`).join('')}</div>`;
 $('modal').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="sheet"><h3>${t?'Edit':'New'} transaction</h3>
 <input id="fa" class="amt" type="number" inputmode="decimal" step="any" placeholder="0" value="${t?Math.abs(t.a):''}">
 <input type="hidden" id="fk"><input type="hidden" id="fb">
 ${sg('fk',[['in','Money in'],['out','Money out'],['bp','Owner draw'],['pb','Contribution']])}
 <p class="mut" id="fh" style="margin:8px 2px 0"></p>
 <label>Description</label><input id="ft" placeholder="What was it for?" value="${esc(t?.t||'')}">
 <div id="frb"><label>Belongs to</label>${sg('fb',[['biz','Business'],['per','Personal']])}</div>
 <div class="g2" id="frd"><div><label>Date</label><input id="fd" type="date" value="${t?t.d:today()}"></div><div id="frc"><label>Category</label><select id="fc"></select></div></div>
 <div class="g2" style="margin-top:18px"><button class="p" onclick="saveF('${t?t.id:''}')">Save</button><button onclick="closeM()">Cancel</button></div>
 ${t?`<button style="margin-top:10px;width:100%;color:var(--neg)" onclick="if(confirm('Delete this transaction?'))delTx('${t.id}')">Delete</button>`:''}</div></div>`;
 $('fk').value=k;$('fb').value=t?.b||'biz';fcats(t?.c||'');
}
const seg=(n,v)=>{$(n).value=v;fcats()};
function fcats(init){
 const k=$('fk').value,b=$('fb').value,tr=k=='bp'||k=='pb';
 document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',$(x.parentNode.dataset.s).value==x.dataset.v));
 $('fh').textContent=tr?(k=='bp'?'Moves money from Business to Personal. The bank total stays the same.':'Moves money from Personal to Business. The bank total stays the same.'):'';
 $('frb').style.display=$('frc').style.display=tr?'none':'';$('frd').style.gridTemplateColumns=tr?'1fr':'';
 const l=(CATS[b]||{})[k]||[],cur=init??$('fc').value;
 $('fc').innerHTML='<option value="">— none —</option>'+[...new Set([...l,...(cur&&!l.includes(cur)?[cur]:[])])].map(x=>`<option ${x==cur?'selected':''}>${esc(x)}</option>`).join('');
}
function saveF(i){
 const k=$('fk').value,d=$('fd').value,a=Math.abs(+$('fa').value);
 if(!d||!a){toast('Enter a date and an amount');return}
 const tr=k=='bp'||k=='pb',desc=$('ft').value.trim(),id=i||uid();
 const t=tr?{id,k:'t',dir:k,d,t:desc||(k=='bp'?'Owner draw':'Owner contribution'),a}
  :{id,d,t:desc||'(no description)',a:k=='in'?a:-a,b:$('fb').value,c:$('fc').value};
 closeM();saveTx(t);
}
const closeM=()=>$('modal').innerHTML='';
addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab=='trend')draw()},150)});

/* ---------- trends ---------- */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const short=n=>{const a=Math.abs(n),r=sym()=='Rp',g=(v,u)=>(n<0?'-':'')+(Math.round(v*10)/10).toString().replace('.',r?',':'.')+u;return a>=1e9?g(a/1e9,r?'M':'B'):a>=1e6?g(a/1e6,r?'jt':'M'):a>=1e3?g(a/1e3,r?'rb':'k'):String(Math.round(n))};
function series(n){
 const by={},z=()=>({inc:0,exp:0,ing:0,dr:0,co:0,pin:0,pout:0,db:0,dp:0});
 calc().all.forEach(t=>{const m=by[mOf(t.d)]=by[mOf(t.d)]||z();
  if(t.k=='t'){if(t.dir=='bp'){m.dr+=t.a;m.db-=t.a;m.dp+=t.a}else{m.co+=t.a;m.dp-=t.a;m.db+=t.a}}
  else if(t.b!='per'){m.db+=t.a;if(t.a>0)m.inc+=t.a;else{m.exp-=t.a;if(t.c=='Ingredients')m.ing-=t.a}}
  else{m.dp+=t.a;if(t.a>0)m.pin+=t.a;else m.pout-=t.a}});
 const ks=Object.keys(by).sort(),end=ks.length?ks[ks.length-1]:ym(new Date()),[ey,em]=end.split('-').map(Number),keys=[];
 for(let i=0;i<n;i++)keys.unshift(ym(new Date(ey,em-1-i,1)));
 let b=S.set.ob||0,p=S.set.op||0;
 ks.filter(k=>k<keys[0]).forEach(k=>{b+=by[k].db;p+=by[k].dp});
 return keys.map(k=>{const m=by[k]||z();b+=m.db;p+=m.dp;return{k,...m,profit:m.inc-m.exp,pct:m.inc>0?m.ing/m.inc*100:null,saved:m.pin-m.pout+m.dr-m.co,biz:b,per:p}});
}
function chart(type,keys,ser,pct){
 const W=Math.max(260,Math.min(688,($('app').clientWidth||360)-34)),H=200,L=pct?36:48,R=8,T=10,B=26,iw=W-L-R,ih=H-T-B,n=keys.length,step=iw/n;
 const all=ser.flatMap(x=>x.v.filter(q=>q!=null));
 let lo=Math.min(0,...all),hi=Math.max(0,...all);if(hi==lo)hi=lo+1;
 const y=q=>T+ih*(1-(q-lo)/(hi-lo)),tf=pct?(q=>Math.round(q)+'%'):short;
 let g='';
 for(let i=0;i<=3;i++){const q=lo+(hi-lo)*i/3,yy=y(q);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" class="ax">${tf(q)}</text>`}
 if(lo<0)g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--mut)"/>`;
 keys.forEach((k,i)=>{if(step<26&&(n-1-i)%2)return;g+=`<text x="${L+step*(i+.5)}" y="${H-8}" text-anchor="middle" class="ax">${MN[+k.slice(5)-1]}</text>`});
 if(type=='bar'){const w=Math.min(30,step*.72/ser.length);ser.forEach((x,j)=>x.v.forEach((q,i)=>{if(q==null)return;const y0=y(0),y1=y(q);g+=`<rect x="${L+step*(i+.5)-w*ser.length/2+w*j}" y="${Math.min(y0,y1)}" width="${w-1}" height="${Math.max(1,Math.abs(y0-y1))}" rx="4" style="fill:${q<0&&x.neg?'var(--neg)':x.c}"/>`}))}
 else ser.forEach(x=>{let d='',dots='';x.v.forEach((q,i)=>{if(q==null)return;const cx=L+step*(i+.5),cy=y(q);d+=(d?'L':'M')+cx+' '+cy;dots+=`<circle cx="${cx}" cy="${cy}" r="3" style="fill:${x.c}"/>`});g+=`<path d="${d}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="stroke:${x.c}"/>${dots}`});
 return`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${g}</svg>`;
}
function vTrend(){
 const n=S.tr||6,d=series(n),L=d[n-1],P=d[n-2],keys=d.map(x=>x.k),v=f=>d.map(f);
 const chips=[3,6,12].map(k=>`<button class="${n==k?'on':''}" onclick="S.tr=${k};draw()">${k} months</button>`).join('');
 if(!d.some(x=>x.inc||x.exp||x.pin||x.pout||x.dr||x.co))return`<h2>Trends</h2><div class="chips">${chips}</div><div class="card"><h3>Nothing to chart yet</h3><p class="mut">Add a few transactions and your trends will show up here.</p></div>`;
 const lg=a=>`<div class="lg">${a.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`;
 const dv=(a,b)=>`<span class="${a>=b?'pos':'neg'}">${a>=b?'Up':'Down'} ${fmt(Math.abs(a-b))}</span> from last month`;
 const sec=(t,s,l,svg)=>`<section class="sec"><h3>${t}</h3><p class="mut" style="margin:-6px 0 10px">${s}</p>${l}${svg}</section>`;
 return`<h2>Trends</h2><div class="chips">${chips}</div><p class="mut" style="margin:0 0 12px">${mlabel(keys[0])} to ${mlabel(L.k)}</p>`
 +sec('Income and expenses','Business money in and out each month',lg([['var(--bizf)','Income'],['var(--mut)','Expenses']]),chart('bar',keys,[{v:v(x=>x.inc),c:'var(--bizf)'},{v:v(x=>x.exp),c:'var(--mut)'}]))
 +sec('Profit',dv(L.profit,P.profit),'',chart('bar',keys,[{v:v(x=>x.profit),c:'var(--pos)',neg:1}]))
 +sec('Ingredient cost',L.pct==null?'No sales in the latest month':Math.round(L.pct)+'% of sales in the latest month','',chart('line',keys,[{v:v(x=>x.pct),c:'var(--bizf)'}],1))
 +sec('Where the money sits','Balance at the end of each month',lg([['var(--bizf)','Business cash'],['var(--perf)','Personal savings']]),chart('line',keys,[{v:v(x=>x.biz),c:'var(--bizf)'},{v:v(x=>x.per),c:'var(--perf)'}]))
 +sec('Saved each month',dv(L.saved,P.saved),'',chart('bar',keys,[{v:v(x=>x.saved),c:'var(--perf)',neg:1}]));
}

/* ---------- export ---------- */
async function exportCSV(){
 const all=[...calc().all].sort((a,b)=>a.d.localeCompare(b.d));
 if(!all.length){toast('Nothing to export yet');return}
 const sp=S.set.sep||',',r2=x=>Math.round(x*100)/100;
 const q=v=>{v=String(v??'');if(/^[=+\-@]/.test(v))v="'"+v;return/[";,\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const rows=[['Date','Month','Description','Type','Bucket','Category','Amount','Business effect','Personal effect']];
 for(const t of all){
  const tr=t.k=='t',p=t.b=='per',bp=t.dir=='bp';
  rows.push([t.d,t.d.slice(0,7),q(t.t),tr?(bp?'Owner draw':'Contribution'):t.a>=0?'Money in':'Money out',tr?'Transfer':p?'Personal':'Business',q(tr?'':t.c||''),r2(t.a),tr?r2(bp?-t.a:t.a):p?0:r2(t.a),tr?r2(bp?t.a:-t.a):p?r2(t.a):0]);
 }
 const csv='\uFEFF'+rows.map(r=>r.join(sp)).join('\r\n'),fn='two-pots-'+today()+'.csv';
 let dl=null;try{dl=window.claude?await claude.use('downloads'):null}catch(e){}
 if(dl){try{await dl.save({filename:fn,data:csv});toast('Saved '+fn)}catch(e){if(e&&e.code!='declined')toast('Could not save the file')}return}
 if(window.claude){toast('Downloads are not available here');return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);
}

/* ---------- settings ---------- */
function vSet(){
 const sp=S.set.sep||',';
 return`<h2>Settings</h2><div class="card"><h3>Export for analysis</h3><p class="mut" style="margin:0">Every transaction in one CSV file, ready for Excel, Google Sheets or Python.</p>
 <label>Column separator</label><select onchange="setS('sep',this.value)"><option value="," ${sp==','?'selected':''}>Comma (Google Sheets, Python)</option><option value=";" ${sp==';'?'selected':''}>Semicolon (Excel with Indonesian settings)</option></select>
 <button class="p" style="width:100%;margin-top:16px" onclick="exportCSV()">Export CSV</button></div>
 <div class="card"><h3>Currency</h3><input value="${esc(sym())}" onchange="setS('sym',this.value)"></div>
 <div class="card"><h3>About your data</h3><p class="mut" style="margin:0">${db?'Everything is saved privately to this page, so your laptop and phone stay in sync when you open the same link while signed in to Claude. Only transactions are stored, never account numbers or logins.':'Everything is saved in this browser on this device only. It does not sync to other devices, and clearing your browser data erases it. Export a CSV now and then as a backup. Only transactions are stored, never account numbers or logins.'}</p></div>`;
}

/* ---------- render + start ---------- */
function draw(){
 document.querySelectorAll('#nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
 if(!S.init||(db&&!(S.a&&S.b))){$('app').innerHTML='<p class="mut">Loading…</p>';return}
 $('app').className=S.tab;$('app').innerHTML=({home:vHome,tx:vTx,trend:vTrend,set:vSet})[S.tab]();
}
{let ly=scrollY,busy=false;
 addEventListener('scroll',()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{
  const y=scrollY,d=y-ly,nav=$('nav'),end=innerHeight+y>=document.documentElement.scrollHeight-48;
  if(y<48||end)nav.classList.remove('hide');
  else if(d>8)nav.classList.add('hide');
  else if(d<-8)nav.classList.remove('hide');
  if(Math.abs(d)>8)ly=y;busy=false})},{passive:true});}
(async()=>{
 draw();
 try{db=window.claude?await claude.use('db'):null}catch(e){db=null}
 S.init=true;
 if(!db){S.months=LS.get('months')||{};S.set=LS.get('settings')||{};draw();return}
 db.collection('months').onSnapshot(s=>{S.months={};s.docs.forEach(d=>{S.months[d.id]=d.data()});S.a=1;draw()},()=>toast('Could not load saved data'));
 db.doc('meta/settings').onSnapshot(s=>{S.set=s.exists?{...s.data()}:{};S.b=1;draw()},()=>toast('Could not load settings'));
})();
</script>
